minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

minimumReleaseAgeExclude:
  - '@ztd-me/eslint'

packages:
  - .

overrides:
  # Keep vinext's optional OG renderer on the patched ZIP decoder.
  fflate@>=0.7.0 <0.7.5: 0.7.5

allowBuilds:
  esbuild: true
  workerd: true
