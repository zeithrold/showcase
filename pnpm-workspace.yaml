minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@ztd-me/*'

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - .

overrides:
  # Keep vinext's optional OG renderer on the patched ZIP decoder.
  fflate@>=0.7.0 <0.7.5: 0.7.5

packageExtensions:
  '@ztd-me/frontend-checks@0.1.1':
    dependencies:
      typescript: 6.0.3

patchedDependencies:
  '@radix-ui/react-select@2.3.7': components/ui/ztd-me/patches/@radix-ui__react-select@2.3.7.patch
  '@ztd-me/frontend-checks@0.1.1': patches/@ztd-me__frontend-checks@0.1.1.patch
  vaul@1.1.2: components/ui/ztd-me/patches/vaul@1.1.2.patch

allowBuilds:
  esbuild: true
  workerd: true
